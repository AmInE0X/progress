<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e31e24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007229;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circular arcs -->
  <g transform="translate(50, 50)">
    <path d="M0,-40 Q20,-40 40,0" stroke="url(#grad1)" stroke-width="12" fill="none"/>
    <path d="M0,-40 Q-20,-40 -40,0" stroke="url(#grad1)" stroke-width="12" fill="none"/>
    <path d="M40,0 Q60,0 40,40" stroke="url(#grad1)" stroke-width="12" fill="none"/>
    <path d="M40,0 Q20,0 40,-40" stroke="url(#grad1)" stroke-width="12" fill="none"/>
    <path d="M-40,0 Q-60,0 -40,40" stroke="url(#grad1)" stroke-width="12" fill="none"/>
    <path d="M-40,0 Q-20,0 -40,-40" stroke="url(#grad1)" stroke-width="12" fill="none"/>
    <path d="M0,40 Q20,40 40,0" stroke="url(#grad1)" stroke-width="12" fill="none"/>
    <path d="M0,40 Q-20,40 -40,0" stroke="url(#grad1)" stroke-width="12" fill="none"/>
  </g>
  
  <!-- PROGRES Text -->
  <text x="140" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#000">PROGRES</text>
</svg>
